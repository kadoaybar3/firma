# Netlify dağıtım yapılandırması — Firma Rehberi
#
# ORTAM DEĞİŞKENLERİ (Netlify arayüzünde Site settings → Environment variables):
#   VITE_SUPABASE_URL       → Supabase proje URL'si (.env'dekiyle aynı; Değer ekrana yazılmaz)
#   VITE_SUPABASE_ANON_KEY  → Supabase publishable (anon) key — service_role DEĞİL
#   SITE_URL                → Üretim adresi (ör. https://firma-rehberi.netlify.app);
#                             sitemap üretimi ve canonical URL buna bağlı
#   GOOGLE_PLACES_API_KEY   → Places API (New) anahtarı (/api/places-search için);
#                             tanımsızsa arama ucu açılmaz (503)
# (opsiyonel, otomatik işletme bulma — Python koleksiyon servisi ayakta olmalı)
#   COLLECTOR_BASE_URL      → Python servisinin adresi (ör. http://127.0.0.1:8787
#                             veya ayrı sunucu: https://kolektor.ornek.com)
#   COLLECTOR_API_KEY       → Python servisinin beklediği servis anahtarı;
#                             proxy her isteğe sunucuda x-collector-key ekler
# (opsiyonel, daha ileri ödeme entegrasyonu için)
#   VITE_PAYMENT_PROVIDER
#   VITE_PAYMENT_CHECKOUT_URL
#
# NOT: service_role/secret anahtar NETLIFY'a da GİRMEZ; istemci kişiler yalnız
# publishable key kullanır ve tüm erişim RLS arkasındadır.

[build]
  command = "npm run build"
  publish = "dist"

# SPA: tüm derin bağlantılar (/firma/x, /yonetim, /temsilci …) index.html'e düşer
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "20"
